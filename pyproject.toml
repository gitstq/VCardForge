[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vcardforge"
version = "1.0.0"
description = "零依赖 · 离线优先的 vCard (.vcf) 通讯录工具箱 / Zero-dependency, offline-first vCard toolkit"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "VCardForge Contributors" }]
keywords = ["vcard", "vcf", "contacts", "address-book", "cli", "offline"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Topic :: Utilities",
]

[project.scripts]
vcardforge = "vcardforge.cli:main"

[project.urls]
Homepage = "https://github.com/gitstq/VCardForge"
Repository = "https://github.com/gitstq/VCardForge"
Issues = "https://github.com/gitstq/VCardForge/issues"

[tool.setuptools]
packages = ["vcardforge"]
